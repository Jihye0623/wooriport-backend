spring:
  application:
    name: wooriport
  data:
    redis:
      host: localhost
      port: 6379
  profiles:
    include: secret

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/wooriport

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: approval-detect-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    # Phase 1: 급여 재처리 토픽 발행용 프로듀서 (JSON 문자열)
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always


springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework.security: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Kafka 실험 측정용 Timer 퍼센타일(클라이언트 계산) 노출 → Grafana
      percentiles:
        tx.e2e.latency: 0.5, 0.95, 0.99
        tx.persist: 0.5, 0.95, 0.99
        tx.challenge: 0.5, 0.95, 0.99
        tx.salary: 0.5, 0.95, 0.99

flask:
  ml-url: http://localhost:8000

# Phase 1 결함 주입(chaos) 토글 — 기본 off. 평상시/운영엔 아무 영향 없음.
chaos:
  salary-fail:    ${CHAOS_SALARY_FAIL:none}      # none | once | always — 급여 처리 강제 실패(재처리 토픽 데모)
  challenge-fail: ${CHAOS_CHALLENGE_FAIL:none}   # none | once | always — 챌린지 증분 강제 실패(DB 재계산 데모)