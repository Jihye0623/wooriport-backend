spring:
  application:
    name: wooriport
  data:
    redis:
      host: localhost
      port: 6379
  profiles:
    include: secret

  datasource:
    driver-class-name: org.postgresql.Driver
    # reWriteBatchedInserts=true: 다중 단건 INSERT → 멀티로우 INSERT 재작성 (PostgreSQL JDBC 최적화)
    url: jdbc:postgresql://localhost:5432/wooriport?reWriteBatchedInserts=true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Phase 2: saveAll 배치 INSERT 활성화 (100건씩 묶어서 전송)
        jdbc:
          batch_size: 100
        order_inserts: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: approval-detect-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Phase 2: 배치 poll 크기 (SalaryRetryConsumer 는 단건 처리라 영향 없음)
      max-poll-records: 2000
      # Phase 3 sweep — fetch 튜닝 (주석 해제 후 재기동으로 적용)
      #fetch-min-size: 1       # fetch.min.bytes: 기본 1 byte → 65536/131072 시도
      #fetch-max-wait: 500     # fetch.max.wait.ms: 기본 500 ms → 100/50 시도
    # Phase 1: 급여 재처리 토픽 발행용 프로듀서 (JSON 문자열)
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Phase 3 sweep — producer 튜닝 (주석 해제 후 재기동으로 적용)
      #acks: '1'               # 1(기본·빠름) | all(내구성·느림)
      #compression-type: none  # none | lz4 | zstd
      #batch-size: 16384       # bytes: 16384(기본) | 65536 | 131072
      #enable-idempotence: false  # true 는 acks=all 강제 + 프로듀서 exactly-once
      properties:
        linger.ms: 0           # Phase 3 sweep: 0(기본·즉시) | 5 | 20 ms

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always


springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework.security: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Kafka 실험 측정용 Timer 퍼센타일(클라이언트 계산) 노출 → Grafana
      percentiles:
        tx.e2e.latency: 0.5, 0.95, 0.99
        tx.persist: 0.5, 0.95, 0.99
        tx.challenge: 0.5, 0.95, 0.99
        tx.salary: 0.5, 0.95, 0.99
        # Phase 2: 배치 크기 분포 (poll 당 처리 건수 p50/p95/p99)
        tx.batch.size: 0.5, 0.95, 0.99

flask:
  ml-url: http://localhost:8000

# Phase 1 결함 주입(chaos) 토글 — 기본 off. 평상시/운영엔 아무 영향 없음.
chaos:
  salary-fail:    ${CHAOS_SALARY_FAIL:none}      # none | once | always — 급여 처리 강제 실패(재처리 토픽 데모)
  challenge-fail: ${CHAOS_CHALLENGE_FAIL:none}   # none | once | always — 챌린지 증분 강제 실패(DB 재계산 데모)

# Phase 3 sweep 제어 — 아래 두 값만 바꿔가며 재기동
wooriport:
  kafka:
    partitions: 6            # transaction-events 파티션 수: 3 | 6 | 9  (증가만 가능; 줄이려면 토픽 삭제)
    consumer-concurrency: 6  # 컨슈머 동시 스레드 수: 1 | 3 | 6  (반드시 ≤ partitions)